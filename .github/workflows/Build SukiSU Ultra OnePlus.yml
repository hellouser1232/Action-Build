name: 构建一加SukiSU Ultra内核
on:
  workflow_dispatch:
    inputs:
      配置文件:
        type: choice
        description: "选择要构建的设备配置文件"
        required: true
        default: oneplus_ace2_pro_v
        options:
          - oneplus_nord_ce4_lite_5g_v
          - oneplus_nord_ce4_v
          - oneplus_nord_4_v
          - oneplus_ace_3v_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_11r_v
          - oneplus_ace2_v
          - oneplus_ace_pro_v
          - oneplus_11_v
          - oneplus_12r_v
          - oneplus_ace2_pro_v
          - oneplus_ace3_v
          - oneplus_open_v
          - oneplus_open_b
          - oneplus_12_v
          - oneplus_12_b
          - oneplus_13r
          - oneplus_13r_b
          - oneplus_ace3_pro_v
          - oneplus_ace5
          - oneplus_ace5_b
          - oneplus_pad_pro_v
          - oneplus_pad2_v
          - oneplus_nord_5
          - oneplus_ace5_pro_b
          - oneplus_13_b
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace5_ultra
          - oneplus_ace_6
          - oneplus_15
      SUSFS模块下载方式:
        type: choice
        description: "下载SUSFS模块的调用方式"
        required: true
        default: NoN
        options:
          - CI
          - Release
          - NoN
      分支和版本设置:
        type: string
        description: "分支名(必填)/自定义版本标识(留空不修改)/调整提交hash(留空不修改)"
        required: false
        default: "susfs-main/Numbersf/"
      构建时间:
        type: string
        description: "自定义构建时间(输入F使用当前UTC时间)"
        required: false
        default: "Mon Aug 18 09:30:24 UTC 2025"
      内核后缀:
        type: string
        description: "自定义内核后缀(不输入使用随机字符串)"
        required: false
        default: ""
      极速构建:
        type: boolean
        description: "是否启用极速构建？"
        required: true
        default: true
      内核模块:
        type: boolean
        description: "是否启用内核模块(KPM)？"
        required: true
        default: true
      分区保护:
        type: boolean
        description: "是否启用关键分区写入保护模块(BBG)？"
        required: true
        default: true
      风驰驱动:
        type: boolean
        description: "是否添加风驰驱动1.0？"
        required: true
        default: false
      ZRAM算法:
        type: boolean
        description: "是否添加更多ZRAM算法？"
        required: true
        default: false

jobs:
  构建内核:
    name: ${{ github.event.inputs.极速构建 == 'true' && ' [极速构建]' || '' }}${{ github.event.inputs.内核模块 == 'true' && ' [KPM模块]' || '' }}${{ github.event.inputs.分区保护 == 'true' && ' [分区保护]' || '' }}${{ github.event.inputs.风驰驱动 == 'true' && ' [风驰驱动]' || '' }}${{ github.event.inputs.ZRAM算法 == 'true' && ' [ZRAM算法]' || '' }}设备: ${{ github.event.inputs.配置文件 }} ${{ github.event.inputs.内核后缀 }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 提取清单信息
        id: 提取信息
        env:
          配置文件: ${{ github.event.inputs.配置文件 }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if [[ "$配置文件" =~ ^(.+)_([a-zA-Z])$ ]]; then
            配置文件_精简="${BASH_REMATCH[1]}"
          else
            配置文件_精简="$配置文件"
          fi
          设备基名=$(echo "$配置文件_精简" | sed -E 's/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/Realme/; s/^oppo/Oppo/')
          mkdir -p ".repo/manifests_fallback"
          清单路径=".repo/manifests_fallback/${配置文件}.xml"
          说明文件路径=".repo/manifests_fallback/README.md"
          echo "处理 配置文件=$配置文件, 精简=$配置文件_精简, 基名=$设备基名"
          echo "配置文件_精简=$配置文件_精简" >> $GITHUB_ENV
          echo "设备基名=$设备基名" >> $GITHUB_ENV

          # 动态调用源码清单仓库，仓库优先级：1️⃣ OnePlusOSS → 2️⃣ Numbersf(可替换)
          declare -A 仓库列表
          仓库列表["OnePlusOSS"]="https://api.github.com/repos/OnePlusOSS/kernel_manifest"
          仓库列表["Dynamic"]="https://api.github.com/repos/Numbersf/kernel_manifest"

          找到的仓库=""
          找到的分支=""

          检查仓库() {
            local 所有者=$1
            local 仓库URL=$2

            echo "🌐 尝试拉取 ${所有者} 分支列表..."
            分支列表=$(curl -s ${仓库URL}/branches | jq -r '.[].name' || true)
            if [[ -z "$分支列表" ]]; then
              echo "⚠️ ${所有者} 分支列表获取失败，跳过。"
              return 1
            fi
            for 分支 in $分支列表; do
              清单URL="https://raw.githubusercontent.com/${所有者}/kernel_manifest/$分支/${配置文件}.xml"
              说明文件URL="https://raw.githubusercontent.com/${所有者}/kernel_manifest/$分支/README.md"
              if curl -sf --head "$清单URL" > /dev/null; then
                echo "✅ 在 ${所有者} 找到 ${配置文件}.xml (分支: $分支)"
                curl -s -o "$清单路径" "$清单URL"
                curl -s -o "$说明文件路径" "$说明文件URL" || true
                找到的仓库="$所有者"
                找到的分支="$分支"
                return 0
              fi
            done
            return 1
          }

          # 首先尝试默认仓库
          if 检查仓库 "OnePlusOSS" "${仓库列表["OnePlusOSS"]}"; then
            echo "清单仓库=OnePlusOSS" >> $GITHUB_ENV
            echo "清单分支=$找到的分支" >> $GITHUB_ENV
          fi

          # 然后尝试动态仓库
          if [[ -z "$找到的仓库" ]]; then
            动态URL="${仓库列表["Dynamic"]}"
            动态所有者=$(echo "$动态URL" | sed -E 's#https://api.github.com/repos/([^/]+)/.*#\1#')
            if 检查仓库 "$动态所有者" "$动态URL"; then
              echo "清单仓库=$动态所有者" >> $GITHUB_ENV
              echo "清单分支=$找到的分支" >> $GITHUB_ENV
            fi
          fi

          if [[ -z "$找到的仓库" || ! -s "$清单路径" ]]; then
            echo "❌ 无法在动态仓库中找到 ${配置文件}.xml"
            exit 1
          fi

          # 解析 revision 字符串
          修订版本=$(grep -oP '<project[^>]+revision="\K[^"]+' "$清单路径" | head -n1 || true)
          echo "解析配置文件获取CPU和安卓版本..."
          # 提取CPU类型
          CPU类型=$(echo "$修订版本" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          # 提取安卓版本
          安卓版本=$(echo "$修订版本" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          if [[ -n "$CPU类型" && -n "$安卓版本" ]]; then
            echo "✅ CPU类型=$CPU类型, 安卓版本=$安卓版本"
            echo "CPU类型=$CPU类型" >> $GITHUB_ENV
            echo "安卓版本=$安卓版本" >> $GITHUB_ENV
            # 获取短位安卓版本号
            echo "安卓短版本=${安卓版本%%.*}" >> $GITHUB_ENV
          else
            echo "❌ 无法从revision中提取CPU类型或安卓版本"
            exit 1
          fi

          echo "解析README.md获取CPUD和构建方法..."
          if [[ -s "$说明文件路径" ]]; then
            构建行=$(grep -m1 'oplus_build_kernel.sh' "$说明文件路径" || true)
            if [[ -n "$构建行" ]]; then
              CPUD=$(echo "$构建行" | awk '{print $(NF-1)}')
              构建方法=$(echo "$构建行" | awk '{print $NF}')
              echo "✅ CPUD=$CPUD, 构建方法=$构建方法"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "构建方法=$构建方法" >> $GITHUB_ENV
            else
              echo "❌ README.md中未找到构建命令"
            fi
          else
            echo "❌ README.md下载失败或为空"
          fi
          # 传递组合信息
          echo "value=${设备基名}_安卓${安卓版本}" >> "$GITHUB_OUTPUT"

      - name: 调试显示选择的输入
        run: |
          echo "-----------------------"
          echo "选择的CPU: ${{ env.CPU类型 }}"
          echo "选择的CPUD: ${{ env.CPUD }}"
          echo "选择的安卓版本: ${{ env.安卓版本 }}"
          echo "选择的构建方法: ${{ env.构建方法 }}"
          echo "选择的配置文件: ${{ github.event.inputs.配置文件 }}"
          echo "自定义分支版本设置: ${{ github.event.inputs.分支和版本设置 }}"
          echo "自定义构建时间: ${{ github.event.inputs.构建时间 }}"
          echo -n "构建时间Unicode编码: "
          python3 -c "print(''.join(f'U+{ord(c):04X} ' for c in '''${{ github.event.inputs.构建时间 }}'''))"
          echo "自定义内核后缀: ${{ github.event.inputs.内核后缀 }}"
          echo -n "内核后缀Unicode编码: "
          python3 -c "print(''.join(f'U+{ord(c):04X} ' for c in '''${{ github.event.inputs.内核后缀 }}'''))"
          echo "选择的SUSFS模块下载方式: ${{ github.event.inputs.SUSFS模块下载方式 }}"
          echo "选择的分区保护: ${{ github.event.inputs.分区保护 }}"
          echo "选择的内核模块: ${{ github.event.inputs.内核模块 }}"
          echo "选择的极速构建: ${{ github.event.inputs.极速构建 }}"
          echo "选择的风驰驱动: ${{ github.event.inputs.风驰驱动 }}"
          echo "选择的ZRAM算法: ${{ github.event.inputs.ZRAM算法 }}"
          echo "-----------------------"

      - name: 检查磁盘空间
        run: df -h

      - name: 创建并启用3G交换空间
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 设置缓存环境
        run: |
          echo "CCACHE目录=$HOME/.ccache_${{ github.event.inputs.配置文件 }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.配置文件 }}"
          echo "设置: $HOME/.ccache_${{ github.event.inputs.配置文件 }}"

      - name: 配置Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: 安装依赖 + APTC
        uses: awalsh128/cache-apt-pkgs-action@latest 
        with: 
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix
          execute_install_scripts: true

      - name: 恢复Ccache缓存
        uses: actions/cache@v3
        with:
          path: ${{ env.CCACHE目录 }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.配置文件 }}-${{ env.构建方法 }}-${{ github.event.inputs.极速构建 == 'true' && 'alpha' || 'beta' }}-16

      - name: 初始化Ccache
        run: |
          初始化标志="${{ env.CCACHE目录 }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$初始化标志" ]; then
              echo "初始化 ccache (${{ env.CCACHE目录 }})..."
              mkdir -p "${{ env.CCACHE目录 }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$初始化标志"
              echo "✅ ccache 初始化完成"
            else
              echo "✅ ccache 已初始化，跳过"
            fi
          else
            echo "❌ 未安装 ccache，跳过"
          fi
          ccache -s

      - name: 安装Repo工具
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: 初始化Repo并同步代码
        env:
          配置文件: ${{ github.event.inputs.配置文件 }}
        run: |
          mkdir 内核工作区 && cd 内核工作区
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${配置文件}.xml" ".repo/manifests/${配置文件}.xml"

          清单仓库="${{ env.清单仓库 }}"
          清单分支="${{ env.清单分支 }}"
          CPU类型="${{ env.CPU类型 }}"
          echo "清单仓库=$清单仓库"
          echo "清单分支=$清单分支"

          基础URL="https://github.com/${清单仓库}/kernel_manifest.git"

          echo "使用 $清单仓库 的分支 $清单分支 初始化仓库..."
          repo init -u "$基础URL" -b "$清单分支" -m "${配置文件}.xml" --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

          for 目录 in kernel_platform/common kernel_platform/msm-kernel; do
            if [ -e "$目录/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$目录/BUILD.bazel"
            fi
            rm -f "$目录/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $目录"
          done

      - name: 内核版本处理
        run: |
          cd 内核工作区/kernel_platform
          # 获取内核安卓版本号(内核安卓版本)以及内核版本号(内核版本)
          for 文件 in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$文件" ]; then
              分支=$(grep -m1 '^BRANCH=' "$文件" | cut -d= -f2)
              [ -n "$分支" ] && break
            fi
          done

          if [ -n "$分支" ]; then
            echo "内核安卓版本=${分支%-*}" >> $GITHUB_ENV
            echo "内核版本=${分支#*-}" >> $GITHUB_ENV
          else
            echo "在build.config文件中未找到BRANCH"
          fi

          # 从Makefile获取完整内核版本号(完整内核版本)以及可选的修改内核等级
          原始版本=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          # 强制修改SUBLEVEL(内核等级)，默认关闭
          # sed -i 's/^SUBLEVEL[[:space:]]*=[[:space:]]*.*/SUBLEVEL = 99/' ./common/Makefile

          # 读取修改后的版本
          新版本=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          if [ "$原始版本" != "$新版本" ]; then
            echo "内核版本:$原始版本->$新版本"
            echo "完整内核版本=$新版本" >> $GITHUB_ENV
          else
            echo "内核版本:$原始版本 无变化"
            echo "完整内核版本=$原始版本" >> $GITHUB_ENV
          fi

      # 自定义内核后缀
      - name: 设置自定义内核后缀
        if: ${{ github.event.inputs.内核后缀 != '' }}
        run: |
          cd 内核工作区
          后缀="${{ github.event.inputs.内核后缀 }}"
          内核安卓版本="${{ env.内核安卓版本 }}"
          极速构建="${{ github.event.inputs.极速构建 }}"

          for 路径 in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$路径" ] || continue

            echo "修改: $路径"

            # 移除-dirty标记
            sed -i 's/ -dirty//g' "$路径"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$路径"

            if grep -q 'KERNELVERSION.*scm_version' "$路径"; then
              echo "检测到新版setlocalversion格式"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${内核安卓版本}-${后缀}\"|" "$路径"

            elif grep -q 'echo "\$res"' "$路径"; then
              echo "检测到旧版setlocalversion格式"
              if [ "$极速构建" = "true" ]; then
                echo "极速构建已启用: 使用静态res"
                sed -i "s/^res=.*/res=\"-${内核安卓版本}-${后缀}\"/" "$路径"
              else
                echo "标准构建: 通过cut/echo注入后缀"
                if [[ -f ./kernel_platform/build_with_bazel.py ]]; then
                  echo "使用官方脚本编译且当使用build_with_bazel时，可能受特殊符号数量限制，编译失败请修改"
                  echo "When using the official script and building with build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the configuration if that happens."
                fi
                tac "$路径" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${后缀}; echo \"\\\$res\";/" | tac > "$路径.tmp" && mv "$路径.tmp" "$路径"
              fi
            else
              echo "未知格式，手动追加echo"
              echo "echo \"\$res-${后缀}\"" >> "$路径"
            fi

            chmod +x "$路径"
          done

          git add -A
          git commit -m "自定义后缀 & 移除-dirty"

      # 伪官方格式的随机后缀（仅在内核后缀未设置时生效）
      - name: 设置随机内核后缀
        if: ${{ github.event.inputs.内核后缀 == '' }}
        run: |
          cd 内核工作区
          内核安卓版本="${{ env.内核安卓版本 }}"
          极速构建="${{ github.event.inputs.极速构建 }}"

          # 生成随机数字和随机哈希
          随机数字=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          随机哈希=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          随机后缀="${随机数字}-o-g${随机哈希}"

          for 路径 in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$路径" ] || continue

            echo "修改: $路径"

            # 移除-dirty标记
            sed -i 's/ -dirty//g' "$路径"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$路径"

            if grep -q 'KERNELVERSION.*scm_version' "$路径"; then
              echo "检测到新版setlocalversion格式"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${内核安卓版本}-${随机后缀}\"|" "$路径"

            elif grep -q 'echo "\$res"' "$路径"; then
              echo "检测到旧版setlocalversion格式"
              if [ "$极速构建" = "true" ]; then
                echo "极速构建已启用: 使用带随机后缀的静态res"
                sed -i "s/^res=.*/res=\"-${内核安卓版本}-${随机后缀}\"/" "$路径"
              else
                echo "标准构建: 通过cut/echo注入随机后缀"
                tac "$路径" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${随机后缀}; echo \"\\\$res\";/" | tac > "$路径.tmp" && mv "$路径.tmp" "$路径"
              fi
            else
              echo "未知格式，手动追加echo"
              echo "echo \"\$res-${随机后缀}\"" >> "$路径"
            fi

            chmod +x "$路径"
          done

          git add -A
          git commit -m "随机后缀 & 移除-dirty"

      - name: 添加SukiSU Ultra
        run: |
          cd 内核工作区/kernel_platform

          元数据="${{ github.event.inputs.分支和版本设置 }}"

          # 必须包含两个分隔符（至少三个字段）
          if [[ "$(grep -o '/' <<< "$元数据" | wc -l)" -lt 2 ]]; then
            echo "错误: 分支和版本设置参数缺少必要的分隔符 '/'，格式应为: 分支名/自定义标识(可省略)/提交hash(可省略)"
            exit 10
          fi

          # 解析字段：分支 / 自定义标识 / 手动hash
          IFS='/' read -r 分支名称 自定义标签 手动哈希 <<< "$元数据"

          echo "分支名: $分支名称"
          [[ -n "$自定义标签" ]] && echo "自定义版本标识: $自定义标签" || echo "自定义版本标识: 未启用"
          [[ -n "$手动哈希" ]] && echo "手动指定hash: $手动哈希" || echo "手动指定hash: 未启用"

          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$分支名称"
          cd ./KernelSU

          # 如果指定了手动hash，就切换到该提交
          if [[ -n "$手动哈希" ]]; then
            git fetch origin "$分支名称" --depth=50
            git checkout "$手动哈希"
            短哈希=${手动哈希:0:8}
          fi

          内核SU_API版本=$(curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/$分支名称/kernel/Makefile" | \
            grep -m1 "KSU_VERSION_API :=" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
          if [[ -z "$内核SU_API版本" || "$(printf '%s\n' "$内核SU_API版本" "3.1.7" | sort -V | head -n1)" != "3.1.7" ]]; then
            内核SU_API版本="3.1.7"
          fi
          echo "内核SU_API版本=$内核SU_API版本" >> $GITHUB_ENV

          GIT哈希=$(git rev-parse --short HEAD)
          echo "GIT哈希=$GIT哈希"

          # 组装版本号
          if [[ -n "$手动哈希" ]]; then
            使用的哈希="$短哈希"
          else
            使用的哈希="$GIT哈希"
          fi
          if [[ -z "$自定义标签" ]]; then
            完整版本="v$内核SU_API版本-$使用的哈希@$分支名称"
          else
            完整版本="v$内核SU_API版本-$自定义标签@$分支名称[$使用的哈希]"
          fi

          # 清理并写入Makefile版本信息
          sed -i '/define get_ksu_version_full/,/endef/d' kernel/Makefile
          sed -i '/KSU_VERSION_API :=/d' kernel/Makefile
          sed -i '/KSU_VERSION_FULL :=/d' kernel/Makefile

          版本定义=$(cat <<EOF
            define get_ksu_version_full
            $完整版本
            endef

            KSU_VERSION_API := $内核SU_API版本
            KSU_VERSION_FULL := $完整版本
          EOF
          )

          awk -v 定义="$版本定义" '
            /REPO_OWNER :=/ {print; print 定义; inserted=1; next}
            1
            END {if (!inserted) print 定义}
          ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile

          内核SU版本=$(expr $(git rev-list --count main 2>/dev/null || echo 13000) + 37185)
          echo "内核SU版本=$内核SU版本" >> $GITHUB_ENV

          echo "::group::最终Makefile中版本信息及部分调试结果预览"
          grep -A10 "REPO_OWNER" kernel/Makefile
          grep "KSU_VERSION_FULL" kernel/Makefile
          echo "::endgroup::"

      - name: 应用SukiSU Ultra补丁
        env:
          配置文件: ${{ github.event.inputs.配置文件 }}
        run: |
          cd 内核工作区
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.内核安卓版本 }}-${{ env.内核版本 }}
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          git clone https://github.com/Numbersf/Action-Build.git
          cd kernel_platform
          echo "正在拉取susfs补丁"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.内核安卓版本 }}-${{ env.内核版本 }}.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          if [ "${{ github.event.inputs.ZRAM算法 }}" = "true" ]; then
            echo "正在拉取zram补丁"
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi

          cd ./common
          通用内核接口版本="${{ env.内核安卓版本 }}-${{ env.内核版本 }}"
          子级别=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')

          if [ "$通用内核接口版本" == "android13-5.15" ] && [ "$子级别" -lt 123 ]; then
            echo "修复内核版本5.15.0到5.15.123仅支持旧版C库造成的一些bug"
            cp ../../Action-Build/patches/fix_5.15.legacy ./fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
            echo "5.15修复补丁完成"
          fi
          信任系统存在="false"
          if [[ "${{ env.内核版本 }}" == "6.6" ]]; then
            if grep -q 'common-modules/trusty' "$GITHUB_WORKSPACE/.repo/manifests_fallback/${配置文件}.xml"; then
              信任系统存在="true"
            fi
            echo "信任系统存在=$信任系统存在" >> $GITHUB_OUTPUT

            if [[ "$信任系统存在" == "false" && "$(printf '%s\n' "${{ env.完整内核版本 }}" "6.6.30" | sort -V | head -n1)" = "${{ env.完整内核版本 }}" ]]; then
              echo "修复内核版本6.6部分机型缺失Trusty OS导致的susfs报错"
              sed -i 's/-32,12 +32,38/-32,11 +32,37/g' 50_add_susfs_in_gki-${{ env.内核安卓版本 }}-${{ env.内核版本 }}.patch
              sed -i '/#include <trace\/hooks\/fs.h>/d' 50_add_susfs_in_gki-${{ env.内核安卓版本 }}-${{ env.内核版本 }}.patch
            fi
          fi
          # 伪补丁修复失败
          伪补丁标记=0
          if [ "$通用内核接口版本" = "android15-6.6" ]; then
            if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              echo "未找到nr_subpages，正在进行补丁修复"
              sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
              伪补丁标记=1
            fi
          fi
          if [ "$通用内核接口版本" = "android12-5.10" ] || [ "$通用内核接口版本" = "android13-5.15" ]; then
            if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
              echo "未找到vma_pages，正在进行补丁修复"
              伪补丁标记=1
            fi
          fi

          echo "正在打susfs补丁"
          patch -p1 < 50_add_susfs_in_gki-${{ env.内核安卓版本 }}-${{ env.内核版本 }}.patch || true
          echo "susfs补丁完成"

          # 恢复
          if [ "$伪补丁标记" = 1 ]; then
            if [ "$通用内核接口版本" = "android15-6.6" ]; then
              if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
              fi
            fi
            if [ "$通用内核接口版本" = "android12-5.10" ] || [ "$通用内核接口版本" = "android13-5.15" ]; then
              if grep -qxF $'\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
            fi
          fi

      - name: 应用隐藏应用补丁
        run: |
          cd 内核工作区/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "正在打隐藏应用补丁"
          patch -p1 -F 3 < 69_hide_stuff.patch
          echo "隐藏应用补丁完成"

      # OGKI转换GKI，无需修改dtbo开机
      - name: 应用OGKI到GKI转换补丁
        if: fromJson(env.内核版本) >= 6.6 && github.event.inputs.风驰驱动 == 'false'
        run: |
          cd 内核工作区/kernel_platform/common
          if [ -d "./kernel/sched/hmbird*" ] || [ -d "./vendor/oplus/kernel/cpu/sched_ext/hmbird*" ]; then
            echo "源码中风驰补丁已经存在，启用二次回退"
            exit 0
          fi
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          cp ../../Action-Build/patches/hmbird_patch.patch ./hmbird_patch.patch
          echo "正在打OGKI转换GKI补丁"
          patch -p1 -F 3 < hmbird_patch.patch
          echo "OGKI转换GKI补丁完成"

      - name: 应用ZRAM补丁
        if: ${{ github.event.inputs.ZRAM算法 == 'true' }}
        run: |
          cd 内核工作区/kernel_platform/common
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.内核版本 }}/lz4kd.patch ./
          echo "正在打lz4kd补丁"
          patch -p1 -F 3 < lz4kd.patch || true
          echo 'lz4kd补丁完成'
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.内核版本 }}/lz4k_oplus.patch ./
          echo "正在打lz4k_oplus补丁"
          patch -p1 -F 3 < lz4k_oplus.patch || true
          echo 'lz4k_oplus补丁完成'

      - name: 应用风驰驱动补丁
        env:
          配置文件: ${{ github.event.inputs.配置文件 }}
        if: ${{ github.event.inputs.风驰驱动 == 'true' }}
        run: |
          cd 内核工作区/kernel_platform/common
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b $CPU类型
          echo "正在拉取风驰补丁"
          cp ./SCHED_PATCH/fengchi_${配置文件}.patch ./
          if [[ -f "fengchi_${配置文件}.patch" ]]; then
            echo "正在打风驰补丁"
            dos2unix "fengchi_${配置文件}.patch"
            patch -p1 -F 3 < "fengchi_${配置文件}.patch"
            echo "风驰补丁完成"
          else
            echo "❌ 未匹配到补丁，风驰内核暂未支持你的机型，请关闭后重试"
            exit 11
          fi

      - name: 应用LSM基带保护
        if: ${{ github.event.inputs.分区保护 == 'true' }}
        run: |
          cd 内核工作区/kernel_platform/common
          echo "正在启用内核级基带保护支持…"
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' ./security/Kconfig

      # 配置信息，带*为附加项目，具有一定危险性和不确定性
      - name: 添加配置设置
        run: |
          cd 内核工作区/kernel_platform/common
          配置文件=./arch/arm64/configs/gki_defconfig
          内核版本="${{ env.内核版本 }}"

          # SukiSU Ultra配置
          echo "CONFIG_KSU=y" >> "$配置文件"

          # KPM配置
          echo "CONFIG_KPM=y" >> "$配置文件"

          # SUSFS配置
          echo "CONFIG_KSU_SUSFS=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$配置文件"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$配置文件"

          # TMPFS配置*
          echo "CONFIG_TMPFS_XATTR=y" >> "$配置文件"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$配置文件"

          # BBR配置*
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$配置文件"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$配置文件"
          echo "CONFIG_NET_SCH_FQ=y" >> "$配置文件"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$配置文件"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$配置文件"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$配置文件"

          # ECN配置*
          echo "CONFIG_IP_ECN=y" >> "$配置文件"
          echo "CONFIG_TCP_ECN=y" >> "$配置文件"
          echo "CONFIG_IPV6_ECN=y" >> "$配置文件"
          echo "CONFIG_IP_NF_TARGET_ECN=y" >> "$配置文件"

          # ZRAM配置*
          if [ "${{ github.event.inputs.ZRAM算法 }}" = "true" ]; then
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$配置文件"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$配置文件"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$配置文件"
            echo "CONFIG_CRYPTO_842=y" >> "$配置文件"
            echo "CONFIG_CRYPTO_LZ4K_OPLUS=y" >> "$配置文件"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$配置文件"
          fi

          # LSM配置*
          if [ "${{ github.event.inputs.分区保护 }}" = "true" ]; then
            echo "CONFIG_BBG=y" >> "$配置文件"
          fi

          # IPSET & IPv6_NAT配置*
          if [[ "${CPU类型}" == sm* ]]; then
            echo "CONFIG_BPF_STREAM_PARSER=y" >> "$配置文件"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$配置文件"
            echo "CONFIG_NETFILTER_XT_SET=y" >> "$配置文件"
            echo "CONFIG_IP_SET=y" >> "$配置文件"
            echo "CONFIG_IP_SET_MAX=65534" >> "$配置文件"
            echo "CONFIG_IP_SET_BITMAP_IP=y" >> "$配置文件"
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "$配置文件"
            echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_IP=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_IPMARK=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_IPMAC=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_MAC=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_NET=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_NETNET=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "$配置文件"
            echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "$配置文件"
            echo "CONFIG_IP_SET_LIST_SET=y" >> "$配置文件"
            echo "CONFIG_IP6_NF_NAT=y" >> "$配置文件"
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> "$配置文件"
          fi

          # 移除构建审查
          sed -i 's/check_defconfig//' ./build.config.gki

      - name: 修复IPv6_NAT错误
        run: |
          cd 内核工作区/kernel_platform/common
          if [[ "${CPU类型}" == sm* ]]; then
            echo "修复启用IPv6 NAT后可能出现的设备误报…"
            cp ../../Action-Build/patches/IPv6_NAT_FIX.patch ./IPv6_NAT_FIX.patch
            patch -p1 -F 3 < IPv6_NAT_FIX.patch
          else
            echo "你的设备不支持IPv6 NAT，跳过此步骤。"
          fi

      # 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: 自定义构建时间
        shell: bash
        run: |
          输入时间="${{ github.event.inputs.构建时间 }}"
          if [[ -n "$输入时间" && "$输入时间" != "F" && "$输入时间" != "f" ]]; then
            日期字符串="$输入时间"
            echo "使用输入的构建时间: $日期字符串"
          else
            日期字符串="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "使用UTC时间作为回退: $日期字符串"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${日期字符串}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd 内核工作区/kernel_platform/
          for 文件 in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$文件" ]; then
              echo "使用构建时间=$日期字符串修补mkcompile_h"
              if grep -q 'UTS_VERSION=' "$文件"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $日期字符串\"}" "$文件"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $日期字符串\" } unless /UTS_VERSION/" "$文件"
              fi
            fi
          done

      - name: 为极速构建启用lto=thin
        if: ${{ (env.内核版本 == '5.10' || env.内核版本 == '5.15') && github.event.inputs.极速构建 == 'true' }}
        run: |
          cd 内核工作区/kernel_platform
          默认配置=./common/arch/arm64/configs/gki_defconfig
          echo "在$默认配置中启用ThinLTO"
          sed -i 's/^CONFIG_LTO=n/CONFIG_LTO=y/' "$默认配置"
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "$默认配置"
          sed -i 's/^CONFIG_LTO_CLANG_NONE=y/CONFIG_LTO_CLANG_THIN=y/' "$默认配置"
          grep -q '^CONFIG_LTO_CLANG_THIN=y' "$默认配置" || echo 'CONFIG_LTO_CLANG_THIN=y' >> "$默认配置"

      - name: 极速构建内核
        if: ${{ github.event.inputs.极速构建 == 'true' }}
        id: 极速构建
        run: |
          内核版本="${{ env.内核版本 }}"
          cd 内核工作区/kernel_platform

          # 自动检测LLVM_IAS
          if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
            使用LLVM_IAS=true
          else
            使用LLVM_IAS=false
          fi

          # 从build.config.common读取CLANG_PREBUILT_BIN
          预编译CLANG路径=$(grep '^CLANG_PREBUILT_BIN=' ./common/build.config.common | cut -d'=' -f2 || true)
          if [[ -z "$预编译CLANG路径" ]]; then
            echo "⚠️ 在build.config.common中未找到CLANG_PREBUILT_BIN，回退至官方构建脚本"
            echo "回退=true" >> "$GITHUB_OUTPUT"
            echo "请考虑关闭极速构建并提交问题"
            exit 0
          fi

          # 优先尝试从CLANG_PREBUILT_BIN提取clang-r版本
          if [[ "$预编译CLANG路径" =~ (clang-r[0-9a-z]+) ]]; then
            CLANG版本="${BASH_REMATCH[1]}"
          else
            # 如果未匹配到，尝试从build.config.constants提取
            if [[ -f ./common/build.config.constants ]]; then
              CLANG版本=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
            fi
          fi

          if [[ -z "$CLANG版本" ]]; then
            echo "⚠️ 未能从CLANG_PREBUILT_BIN或build.config.constants获取到Clang版本，回退至官方构建脚本"
            echo "回退=true" >> "$GITHUB_OUTPUT"
            echo "请考虑关闭极速构建并提交问题"
            exit 0
          fi

          # 替换成新的CLANG_VERSION值
          预编译CLANG路径=${预编译CLANG路径/\$\{CLANG_VERSION\}/$CLANG版本}
          # 获取CLANG_PREBUILT_BIN的第一个目录名，赋值给CLANG目录
          CLANG目录=$(echo "$预编译CLANG路径" | cut -d'/' -f1)
          # 获取CLANG_PREBUILT_BIN的上一级目录名，赋值给CLANG路径
          CLANG路径=$(basename "$(dirname "$预编译CLANG路径")")

          echo "✅ CLANG版本=$CLANG版本"
          echo "✅ CLANG目录=$CLANG目录"
          echo "✅ CLANG路径=$CLANG路径"
          echo "✅ 使用LLVM_IAS=$使用LLVM_IAS"

          export PATH="$GITHUB_WORKSPACE/内核工作区/kernel_platform/$预编译CLANG路径:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          sudo apt install -y libelf-dev ccache

          cd ./common
          编译参数="LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc \
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole \
            LD=ld.lld HOSTLD=ld.lld KCFLAGS+=-Wno-error"

          if [[ "$使用LLVM_IAS" == "true" ]]; then
            编译参数="LLVM_IAS=1 $编译参数"
          fi

          make -j$(nproc --all) O=out $编译参数 gki_defconfig
          make -j$(nproc --all) O=out $编译参数
          ccache -s

      - name: 回退到标准内核构建
        if: ${{ github.event.inputs.极速构建 == 'false' || steps.极速构建.outputs.回退 == 'true' }}
        run: |
          cd 内核工作区
          if [ -f ./kernel_platform/build_with_bazel.py ]; then
            ./kernel_platform/oplus/bazel/oplus_modules_variant.sh ${{ env.CPUD }} ${{ env.构建方法 }}
            ./kernel_platform/build_with_bazel.py --lto=thin -t ${{ env.CPUD }} ${{ env.构建方法 }}
          else
            LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.构建方法 }}
          fi

      - name: 制作AnyKernel3包
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p 内核工作区/kernel_platform/out/最终镜像查找/
          目录1=""
          目录2=""
          镜像路径=$(find "./内核工作区/kernel_platform/common/out/" -name "Image" | head -n 1)
          if [ -n "$镜像路径" ]; then
            目录1=$(dirname "$镜像路径")/
            echo "使用make编译的统一路径，成功找到Image文件"
          else
            镜像路径=$(find "./内核工作区/kernel_platform/out/" -name "Image" | head -n 1)
            if [ -n "$镜像路径" ]; then
              目录2=$(dirname "$镜像路径")/
              echo "使用官方脚本编译，成功找到Image文件"
            else
              echo "未找到Image文件，构建失败" >&2
              exit 1
            fi
          fi
          if [ -n "$镜像路径" ] && [ -f "$镜像路径" ]; then
            echo "Image文件最终位置: $镜像路径"
            cp "$镜像路径" ./AnyKernel3/Image
            cp "$镜像路径" 内核工作区/kernel_platform/out/最终镜像查找/Image
          fi
          if [ -n "$目录2" ] && [ "${{ env.CPU类型 }}" = "sm8750" ] && [ "${{ github.event.inputs.极速构建 }}" = "false" ]; then
            echo "当前正在使用官方脚本构建sm8750，需额外复制一些其它镜像文件：dtbo.img、system_dlkm.img。请注意，如果你在刷完官方脚本构建后想换成极速构建，请还原这些分区！"
            echo "You are currently building sm8750 with the official script. Additional image files will be copied: dtbo.img, system_dlkm.img. Please note: If you switch to fast build after flashing this build, make sure to restore these partitions!"
            for 文件 in dtbo.img system_dlkm.erofs.img; do
              if [ -f "$目录2$文件" ]; then
                目标名称="$文件"
                if [ "$文件" = "system_dlkm.erofs.img" ]; then
                  目标名称="system_dlkm.img"
                fi
                cp "$目录2$文件" "./AnyKernel3/$目标名称"
              else
                echo "$文件不存在，跳过复制"
              fi
            done
          fi

      - name: 应用patch_linux并替换Image
        if: ${{ github.event.inputs.内核模块 == 'true' }}
        run: |
          cd 内核工作区/kernel_platform/common
          cp ../../SukiSU_patch/kpm/patch_linux ../out/最终镜像查找/
          cd ../out/最终镜像查找
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
          cp Image $GITHUB_WORKSPACE/AnyKernel3/Image

      - name: 从CI下载最新SUSFS模块
        if: ${{ github.event.inputs.SUSFS模块下载方式 == 'CI' }}
        continue-on-error: true
        run: |
          最新运行ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -z "$最新运行ID" ]; then
            echo "分支v1.5.2+没有找到成功的运行"
          else
            制品下载URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$最新运行ID/artifacts" | jq -r '.artifacts[0].archive_download_url')
            if [ -n "$制品下载URL" ]; then
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$制品下载URL"
              cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/
            else
              echo "获取制品下载URL失败"
            fi
          fi

      - name: 从Release下载最新SUSFS模块
        if: ${{ github.event.inputs.SUSFS模块下载方式 == 'Release' }}
        continue-on-error: true
        run: |
          wget -O ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/

      - name: 从CI下载最新SukiSU-Ultra APK
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          运行ID=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id' || echo "")
          if [[ -z "$运行ID" ]]; then
            echo "没有找到成功的工作流运行。跳过制品下载。"
          else
            制品URL=$(gh api \
              "repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/$运行ID/artifacts" | \
              jq -r '.artifacts[] | select(.name == "Manager") | .archive_download_url' | head -n1)
            if [[ -z "$制品URL" ]]; then
              echo "在运行$运行ID中没有找到'Manager'制品。跳过下载。"
            else
              echo "从以下地址下载: $制品URL"
              curl -fL -H "Authorization: token $GITHUB_TOKEN" -o Manager.zip "$制品URL"
              unzip -j Manager.zip "*.apk" -d ./AnyKernel3/
            fi
          fi

      - name: 设置压缩包后缀
        id: 后缀
        run: |
          echo "value=${{ github.event.inputs.ZRAM算法 == 'true' && '_LZ4KD' || '' }}${{ github.event.inputs.内核模块 == 'true' && '_KPM' || '' }}${{ github.event.inputs.分区保护 == 'true' && '_LSM' || '' }}_ILH${{ github.event.inputs.风驰驱动== 'true' && '_SCHED' || '' }}" >> $GITHUB_OUTPUT

      - name: 上传AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.内核SU版本 }}_${{ steps.提取信息.outputs.value }}(${{ env.完整内核版本 }})${{ steps.后缀.outputs.value }}
          path: ./AnyKernel3/*

      - name: 下载并解压ZRAM模块
        if: ${{ github.event.inputs.ZRAM算法 == 'true' }}
        id: 查找zram
        run: |
          set -e
          sudo apt install -y unzip
          echo "尝试获取ZRAM模块zip下载链接..."
          重试次数=3
          成功=0
          for i in $(seq 1 $重试次数); do
            echo "第$i次尝试下载..."
            下载链接=$(curl -s https://api.github.com/repos/FurLC/ZRAM-Module/releases/latest | \
              grep "browser_download_url" | grep "ZRAM-Module-.*\.zip" | cut -d '"' -f 4 | head -n 1)

            if [ -n "$下载链接" ]; then
              echo "✅ 成功获取下载链接: $下载链接"
              wget -N "$下载链接" && 成功=1 && break
            else
              echo "⚠️ 获取下载链接失败，等待3秒后重试..."
              sleep 3
            fi
          done

          if [ "$成功" -ne 1 ]; then
            echo "❌ 连续$重试次数次尝试后仍然无法获取ZRAM模块下载链接"
            echo "上传=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unzip "$(ls -t ZRAM-Module-*.zip | head -1)" -d ZRAM-Module
          目标="./ZRAM-Module/zram/zram.ko"
          echo "查找zram.ko模块文件..."
          搜索路径=(
            "./内核工作区/kernel_platform/out"
            "./内核工作区/device/qcom"
          )
          zram路径=""
          for 路径 in "${搜索路径[@]}"; do
            zram路径=$(find "$路径" -type f -name "zram.ko" | head -n 1)
            [ -n "$zram路径" ] && break
          done
          if [ -z "$zram路径" ]; then
            zram路径=$(find "./内核工作区" -type f -name "zram.ko" | head -n 1)
          fi
          if [ -n "$zram路径" ] && [ -f "$zram路径" ]; then
            echo "ZRAM模块文件最终位置: $zram路径"
            mkdir -p "$(dirname "$目标")"
            if [ "$(realpath "$zram路径")" != "$(realpath "$目标")" ]; then
              cp "$zram路径" "$目标"
            else
              echo "源文件与目标路径相同，跳过复制"
            fi
          else
            echo "未找到zram.ko文件，可能是未支持的内核版本或者未成功构建"
            echo "上传=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: 上传ZRAM模块
        if: ${{ github.event.inputs.ZRAM算法 == 'true' && steps.查找zram.outputs.上传 != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZRAM-Module_${{ env.内核版本 }}_${{ steps.提取信息.outputs.value }}
          path: ZRAM-Module/*

      - name: 构建后磁盘检查
        run: df -h

      - name: 清理资源
        if: always()
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          echo "资源清理完成"
